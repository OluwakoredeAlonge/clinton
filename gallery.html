<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gallery — Clinton Vane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="grain">
<div id="site-header"></div>

<main class="pt-32 md:pt-40">
  <section class="max-w-[1500px] mx-auto px-5 md:px-10 pb-10">
    <p class="eyebrow text-smoke mb-4">The archive</p>
    <div class="flex flex-wrap items-end justify-between gap-6">
      <h1 class="display text-[clamp(4rem,12vw,11rem)] leading-[.85]">The <em>Gallery</em></h1>
      <p class="max-w-sm text-smoke">Every painting from the studio: available, sold and held in collections. Click any work to see it at true scale on a wall.</p>
    </div>
  </section>

  <!-- filter bar -->
  <section class="sticky top-16 md:top-20 z-30 bg-paper/90 backdrop-blur-md border-y border-ink/10">
    <div class="max-w-[1500px] mx-auto px-5 md:px-10 py-4 flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
      <div id="chips" class="flex gap-2 overflow-x-auto no-scrollbar -mx-1 px-1"></div>
      <div class="flex flex-wrap items-center gap-3 text-sm">
        <label class="relative"><i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-smoke"></i>
          <input id="q" type="search" placeholder="Search titles" class="pl-9 pr-3 py-2 bg-transparent border border-ink/20 rounded-full outline-none focus:border-ember w-40 md:w-48"></label>
        <select id="medium" class="py-2 px-3 bg-transparent border border-ink/20 rounded-full outline-none focus:border-ember"></select>
        <select id="sort" class="py-2 px-3 bg-transparent border border-ink/20 rounded-full outline-none focus:border-ember">
          <option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="largest">Largest first</option><option value="title">Title A–Z</option>
        </select>
        <label class="flex items-center gap-2 cursor-pointer select-none"><input id="avail" type="checkbox" class="accent-[#c9411b] w-4 h-4"> Available only</label>
        <div class="flex border border-ink/20 rounded-full overflow-hidden">
          <button data-view="masonry" class="p-2.5" aria-label="Masonry"><i data-lucide="layout-dashboard" class="w-4 h-4"></i></button>
          <button data-view="grid" class="p-2.5" aria-label="Grid"><i data-lucide="grid-3x3" class="w-4 h-4"></i></button>
        </div>
      </div>
    </div>
  </section>

  <section class="max-w-[1500px] mx-auto px-5 md:px-10 py-12 min-h-[60vh]">
    <p id="count" class="eyebrow text-smoke mb-8"></p>
    <div id="grid"></div>
    <div id="empty" class="hidden text-center py-24"><i data-lucide="frame" class="w-10 h-10 mx-auto mb-4 text-smoke"></i><p class="display text-4xl mb-2">Nothing on this wall.</p><p class="text-smoke">Try loosening a filter.</p></div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/art.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
